<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香吉士 (Sanji) 完整收藏資料庫系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans HK', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <header class="bg-slate-900 text-white shadow-md py-6 px-4 mb-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-wide">🔥 香吉士 (Sanji) 收藏紀錄（完整版）</h1>
                <p class="text-slate-400 text-sm mt-1">支援讀取完整 Excel 及智慧子資料夾相片載入（共 <span id="totalCount">0</span> 項收藏）</p>
            </div>
            <div id="uploadSection" class="bg-slate-800 p-3 rounded-lg border border-slate-700 flex items-center gap-3">
                <span class="text-xs text-slate-300">請上載您的 Excel 檔案：</span>
                <input type="file" id="excelFile" accept=".xlsx, .xls" class="text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pb-12">
        <div id="filterBar" class="hidden bg-white rounded-xl shadow-sm p-5 mb-8 border border-slate-200 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">關鍵字搜尋</label>
                <input type="text" id="searchInput" placeholder="搜尋名稱、描述、編號..." 
                    class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">分類 (Category)</label>
                <select id="categoryFilter" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">全部分類</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">時期 (Period)</label>
                <select id="periodFilter" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">全部時期</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">排序方式</label>
                <select id="sortSelect" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="no-asc">編號：由細到大 (1 → N)</option>
                    <option value="no-desc">編號：由大到細 (N → 1)</option>
                    <option value="name-asc">名稱：A → Z</option>
                </select>
            </div>
        </div>

        <div id="welcomeScreen" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-16 text-center max-w-2xl mx-auto mt-12">
            <div class="text-4xl mb-4">📂</div>
            <h2 class="text-xl font-bold text-slate-800 mb-2">準備載入您的完整山治收藏資料庫</h2>
            <p class="text-slate-500 text-sm mb-6">請點擊上方按鈕選擇您的 <code class="bg-slate-100 px-2 py-1 rounded text-slate-700">Sanji Record_20261030.xlsx</code> 檔案，網頁將會瞬間讀取全部 1,280 個項目並自動配對相片！</p>
        </div>

        <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <div id="noResults" class="hidden text-center py-16">
            <p class="text-slate-500 text-lg">搵唔到符合條件嘅收藏紀錄。</p>
        </div>
    </main>

    <script>
        let rawData = [];

        const subFolders = [
            "", 
            "Book/", 
            "Calendar/", 
            "Card/", 
            "CD_DVD/", 
            "Clothes_Socks/", 
            "Figures/", 
            "Food_Drink/", 
            "others/", 
            "Paper_product/", 
            "Soft_Toy/", 
            "Souvenir/", 
            "Stationery/"
        ];

        function tryLoadImage(imgElement, imageName) {
            if (!imageName || imageName === "無" || imageName.toString().trim() === "") {
                imgElement.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e1' stroke-width='2'><rect width='18' height='18' x='3' y='3' rx='2' ry='2'/><circle cx='9' cy='9' r='2'/><path d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/></svg>";
                return;
            }

            let imgStr = imageName.toString().trim();
            let baseName = imgStr.substring(0, imgStr.lastIndexOf('.')) || imgStr;
            let ext = imgStr.substring(imgStr.lastIndexOf('.')) || '.jpg';
            let extensions = [ext, ext.toLowerCase(), ext.toUpperCase(), '.jpg', '.JPG', '.jpeg', '.JPEG', '.png', '.PNG'];
            extensions = [...new Set(extensions)];

            let variants = [];
            extensions.forEach(e => {
                variants.push(baseName + e);
            });
            if (!variants.includes(imgStr)) variants.unshift(imgStr);

            let fIndex = 0;
            let vIndex = 0;

            function loadNext() {
                if (fIndex >= subFolders.length) {
                    imgElement.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e1' stroke-width='2'><rect width='18' height='18' x='3' y='3' rx='2' ry='2'/><circle cx='9' cy='9' r='2'/><path d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/></svg>";
                    return;
                }
                let path = subFolders[fIndex] + variants[vIndex];
                let testImg = new Image();
                testImg.onload = function() {
                    imgElement.src = path;
                };
                testImg.onerror = function() {
                    vIndex++;
                    if (vIndex >= variants.length) {
                        vIndex = 0;
                        fIndex++;
                    }
                    loadNext();
                };
                testImg.src = path;
            }
            loadNext();
        }

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    rawData = json.map((row, idx) => ({
                        no: row['No.'] || row['no'] || row['編號'] || (idx + 1),
                        name: row['Item Name'] || row['name'] || row['名稱'] || `Item_${idx+1}`,
                        description: row['Description'] || row['description'] || row['描述'] || '',
                        image: row['Image reference'] || row['image'] || row['圖片'] || '',
                        category: row['Category'] || row['category'] || row['分類'] || '其他',
                        period: row['Two Year Before / After'] || row['period'] || row['時期'] || '',
                        collection: row['Collection'] || row['collection'] || row['系列'] || '',
                        feature: row['造形/特徵'] || row['feature'] || ''
                    })).filter(item => item.name && item.name.toString().trim() !== '');

                    document.getElementById('welcomeScreen').style.display = 'none';
                    document.getElementById('filterBar').classList.remove('hidden');
                    initFilters();
                    render();
                } catch (err) {
                    alert('讀取 Excel 檔案出錯，請確保檔案格式正確。');
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const periodFilter = document.getElementById('periodFilter');
        const sortSelect = document.getElementById('sortSelect');
        const cardGrid = document.getElementById('cardGrid');
        const totalCount = document.getElementById('totalCount');
        const noResults = document.getElementById('noResults');

        function initFilters() {
            const categories = [...new Set(rawData.map(item => item.category).filter(Boolean))].sort();
            const periods = [...new Set(rawData.map(item => item.period).filter(Boolean))].sort();

            categoryFilter.innerHTML = '<option value="">全部分類</option>';
            periodFilter.innerHTML = '<option value="">全部時期</option>';

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categoryFilter.appendChild(opt);
            });

            periods.forEach(per => {
                const opt = document.createElement('option');
                opt.value = per;
                opt.textContent = per;
                periodFilter.appendChild(opt);
            });
        }

        function render() {
            const keyword = searchInput.value.toLowerCase().trim();
            const selectedCategory = categoryFilter.value;
            const selectedPeriod = periodFilter.value;
            const sortBy = sortSelect.value;

            let filtered = rawData.filter(item => {
                const matchKeyword = !keyword || 
                    item.name.toLowerCase().includes(keyword) || 
                    item.description.toLowerCase().includes(keyword) || 
                    item.feature.toLowerCase().includes(keyword) ||
                    item.collection.toLowerCase().includes(keyword) ||
                    item.no.toString().toLowerCase().includes(keyword);
                
                const matchCategory = !selectedCategory || item.category === selectedCategory;
                const matchPeriod = !selectedPeriod || item.period === selectedPeriod;

                return matchKeyword && matchCategory && matchPeriod;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'no-asc') return (parseFloat(a.no) || 0) - (parseFloat(b.no) || 0);
                if (sortBy === 'no-desc') return (parseFloat(b.no) || 0) - (parseFloat(a.no) || 0);
                if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
                return 0;
            });

            totalCount.textContent = filtered.length;

            if (filtered.length === 0) {
                cardGrid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            const displayItems = filtered.slice(0, 300); // 效能優化：分批渲染

            cardGrid.innerHTML = displayItems.map((item, index) => `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow">
                    <div class="h-48 bg-slate-100 relative overflow-hidden flex items-center justify-center border-b border-slate-200">
                        <img data-src="${item.image}" id="img-${index}" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e1' stroke-width='2'><rect width='18' height='18' x='3' y='3' rx='2' ry='2'/><circle cx='9' cy='9' r='2'/><path d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/></svg>" alt="${item.name}" class="w-full h-full object-cover lazy-img">
                        <span class="absolute top-2 left-2 text-xs font-bold px-2.5 py-1 bg-slate-900/80 text-white rounded-full backdrop-blur-sm"># ${item.no}</span>
                        <span class="absolute top-2 right-2 text-xs font-semibold text-blue-700 bg-blue-50/90 px-2 py-0.5 rounded border border-blue-100 backdrop-blur-sm">${item.category || '其他'}</span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col gap-2">
                        <h3 class="font-bold text-slate-800 text-base">${item.name}</h3>
                        <p class="text-xs text-slate-600 line-clamp-3">${item.description || '暫無描述'}</p>
                        
                        <div class="mt-auto pt-3 border-t border-slate-100 flex flex-col gap-1 text-xs text-slate-500">
                            ${item.period ? `<div><span class="font-semibold">時期:</span> ${item.period}</div>` : ''}
                            ${item.feature ? `<div><span class="font-semibold">造形/特徵:</span> ${item.feature}</div>` : ''}
                            ${item.collection ? `<div><span class="font-semibold">系列:</span> ${item.collection}</div>` : ''}
                            <div class="text-slate-400 text-[11px] truncate"><span class="font-semibold">圖片檔名:</span> ${item.image || '無'}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const imgEl = entry.target;
                        const imageName = imgEl.getAttribute('data-src');
                        tryLoadImage(imgEl, imageName);
                        observer.unobserve(imgEl);
                    }
                });
            }, { rootMargin: '300px' });

            document.querySelectorAll('.lazy-img').forEach(img => {
                observer.observe(img);
            });
        }

        searchInput.addEventListener('input', render);
        categoryFilter.addEventListener('change', render);
        periodFilter.addEventListener('change', render);
        sortSelect.addEventListener('change', render);
    </script>
</body>
</html>
